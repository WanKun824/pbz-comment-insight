[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbz-comment-insight"
version = "1.0.0"
description = "B站游戏视频评论的多维结构化决策流水线（Laya / 影之刃零）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "pbz-comment-insight" }]
keywords = ["laya", "bilibili", "comments", "classification", "weak-supervision", "game-analytics"]

dependencies = [
    "laya>=0.4.21",
    "torch>=2.4",
    "transformers>=5.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "tabulate>=0.9",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
pbz = "pbz.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pbz = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# 显式 select，不跟随 ruff 默认集变化，保证 CI 结果可复现
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # 行长交给 line-length
    "E741",   # l 作为循环变量在这个代码库里语义清晰
    "B008",   # argparse default 里调用函数是常规写法
]

[tool.ruff.lint.isort]
known-first-party = ["pbz"]
